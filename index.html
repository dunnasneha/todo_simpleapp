<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasko — Do More, Stress Less</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --surface3: #26262e;
    --border: rgba(255,255,255,0.07);
    --accent: #7b61ff;
    --accent2: #ff6b6b;
    --accent3: #00d2aa;
    --text: #f0f0f5;
    --text2: #9898aa;
    --text3: #5c5c72;
    --pending-glow: rgba(123,97,255,0.18);
    --done-glow: rgba(0,210,170,0.15);
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.28s cubic-bezier(.4,0,.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
    overflow-x: hidden;
  }

  /* ─── Background ─── */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(123,97,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -150px; right: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,210,170,0.09) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Header ─── */
  header {
    position: sticky; top: 0;
    z-index: 100;
    background: rgba(13,13,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.55rem;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    white-space: nowrap;
  }
  .logo span { color: var(--accent); -webkit-text-fill-color: var(--accent); }

  .header-stats {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .stat-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text2);
    white-space: nowrap;
  }
  .stat-pill i { font-size: 0.72rem; }
  .stat-pill.pending { border-color: rgba(123,97,255,0.3); color: #a091ff; }
  .stat-pill.done    { border-color: rgba(0,210,170,0.3); color: var(--accent3); }
  #stat-pending-count, #stat-done-count { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.92rem; }

  /* ─── Main Layout ─── */
  main {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 36px 20px 0;
  }

  /* ─── Add Task Bar ─── */
  .add-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35);
  }

  .add-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  #task-input {
    flex: 1;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 18px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  #task-input::placeholder { color: var(--text3); }
  #task-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(123,97,255,0.15);
  }

  .btn-add {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 13px 22px;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 4px 18px rgba(123,97,255,0.35);
  }
  .btn-add:hover { background: #8f7bff; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(123,97,255,0.45); }
  .btn-add:active { transform: translateY(0); }

  /* ─── Search & Filter ─── */
  .controls-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .search-wrap {
    flex: 1;
    position: relative;
    min-width: 180px;
  }
  .search-wrap i {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 0.82rem;
  }
  #search-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px 10px 36px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--text);
    outline: none;
    transition: border-color var(--transition);
  }
  #search-input::placeholder { color: var(--text3); }
  #search-input:focus { border-color: var(--accent); }

  .filter-tabs {
    display: flex;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px;
  }
  .filter-tab {
    border: none;
    background: transparent;
    color: var(--text2);
    border-radius: 6px;
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }
  .filter-tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 10px rgba(123,97,255,0.35);
  }
  .filter-tab:not(.active):hover { background: var(--surface3); color: var(--text); }

  /* ─── Section Headers ─── */
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .section-label .badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.7rem;
    color: var(--text2);
  }

  /* ─── Task Sections ─── */
  .task-section { margin-bottom: 36px; }

  /* ─── Task Cards ─── */
  .task-list { display: flex; flex-direction: column; gap: 10px; }

  .task-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all var(--transition);
    animation: slideIn 0.32s cubic-bezier(.4,0,.2,1) both;
    position: relative;
    overflow: hidden;
  }
  .task-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    border-radius: 3px 0 0 3px;
    transition: background var(--transition);
  }
  .task-card:hover { border-color: rgba(123,97,255,0.25); box-shadow: 0 4px 24px rgba(0,0,0,0.3); transform: translateY(-1px); }

  .task-card.done {
    opacity: 0.62;
  }
  .task-card.done::before { background: var(--accent3); }

  .task-card.deleting {
    animation: slideOut 0.35s cubic-bezier(.4,0,.2,1) forwards;
  }
  .task-card.completing {
    animation: completeAnim 0.4s cubic-bezier(.4,0,.2,1) forwards;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideOut {
    from { opacity: 1; transform: translateX(0) scale(1); max-height: 200px; margin-bottom: 10px; }
    to   { opacity: 0; transform: translateX(30px) scale(0.95); max-height: 0; margin-bottom: 0; padding: 0; }
  }
  @keyframes completeAnim {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.025); }
    70%  { transform: scale(0.98); }
    100% { transform: scale(1); opacity: 0.62; }
  }

  /* Checkbox */
  .check-btn {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 7px;
    border: 2px solid var(--text3);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
    margin-top: 1px;
  }
  .check-btn:hover { border-color: var(--accent); background: rgba(123,97,255,0.1); }
  .check-btn i { font-size: 0.7rem; color: #fff; opacity: 0; transition: opacity var(--transition); }
  .task-card.done .check-btn {
    background: var(--accent3);
    border-color: var(--accent3);
    box-shadow: 0 0 10px rgba(0,210,170,0.35);
  }
  .task-card.done .check-btn i { opacity: 1; }

  /* Task body */
  .task-body { flex: 1; min-width: 0; }

  .task-text {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
    transition: color var(--transition);
  }
  .task-card.done .task-text {
    text-decoration: line-through;
    color: var(--text3);
  }

  .task-edit-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 7px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--text);
    outline: none;
    box-shadow: 0 0 0 3px rgba(123,97,255,0.12);
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .task-time {
    font-size: 0.72rem;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .task-time i { font-size: 0.65rem; }

  /* Actions */
  .task-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
    align-items: flex-start;
  }
  .icon-btn {
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem;
    transition: all var(--transition);
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(123,97,255,0.1); }
  .icon-btn.save-btn { color: var(--accent3); border-color: rgba(0,210,170,0.3); }
  .icon-btn.save-btn:hover { background: rgba(0,210,170,0.1); }
  .icon-btn.delete-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,107,0.1); }

  /* ─── Empty State ─── */
  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text3);
    display: none;
  }
  .empty-state.visible { display: block; }
  .empty-state i {
    font-size: 2.4rem;
    margin-bottom: 14px;
    opacity: 0.4;
    display: block;
  }
  .empty-state p { font-size: 0.88rem; line-height: 1.7; }

  /* ─── Clear Completed ─── */
  .section-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text3);
    border-radius: var(--radius-sm);
    padding: 5px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all var(--transition);
  }
  .btn-clear:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,107,0.08); }

  /* ─── Responsive ─── */
  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    .logo { font-size: 1.25rem; }
    .header-stats { gap: 8px; }
    .stat-pill { padding: 4px 10px; font-size: 0.72rem; }
    main { padding: 20px 12px 0; }
    .add-bar { padding: 14px; }
    .add-row { flex-direction: column; }
    .btn-add { width: 100%; justify-content: center; }
    .controls-row { flex-direction: column; }
    .filter-tabs { width: 100%; justify-content: center; }
    .task-card { padding: 13px 14px; }
    .task-actions { gap: 4px; }
    .icon-btn { width: 30px; height: 30px; font-size: 0.72rem; }
  }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 6px; }
</style>
</head>
<body>

<header>
  <div class="logo">Task<span>o</span></div>
  <div class="header-stats">
    <div class="stat-pill pending"><i class="fa-solid fa-circle-dot"></i> Pending <span id="stat-pending-count">0</span></div>
    <div class="stat-pill done"><i class="fa-solid fa-circle-check"></i> Done <span id="stat-done-count">0</span></div>
  </div>
</header>

<main>

  <!-- Add Task -->
  <div class="add-bar">
    <div class="add-row">
      <input type="text" id="task-input" placeholder="What needs to be done today?" maxlength="200" autocomplete="off">
      <button class="btn-add" id="add-btn"><i class="fa-solid fa-plus"></i> Add Task</button>
    </div>
    <div class="controls-row">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Search tasks…">
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="pending">Pending</button>
        <button class="filter-tab" data-filter="done">Completed</button>
      </div>
    </div>
  </div>

  <!-- Pending Tasks -->
  <div class="task-section" id="section-pending">
    <div class="section-label">
      <i class="fa-solid fa-layer-group"></i>
      Pending Tasks
      <span class="badge" id="pending-badge">0</span>
    </div>
    <div class="task-list" id="pending-list"></div>
    <div class="empty-state" id="empty-pending">
      <i class="fa-regular fa-clipboard"></i>
      <p>No pending tasks.<br>Add one above to get started!</p>
    </div>
  </div>

  <!-- Completed Tasks -->
  <div class="task-section" id="section-done">
    <div class="section-actions">
      <div class="section-label" style="flex:1;margin-bottom:0;">
        <i class="fa-solid fa-check-double"></i>
        Completed
        <span class="badge" id="done-badge">0</span>
      </div>
      <button class="btn-clear" id="clear-done-btn"><i class="fa-solid fa-trash-can"></i> Clear all</button>
    </div>
    <div class="task-list" id="done-list"></div>
    <div class="empty-state" id="empty-done">
      <i class="fa-regular fa-face-smile-beam"></i>
      <p>Nothing here yet.<br>Complete a task to see it here!</p>
    </div>
  </div>

</main>

<script>
  // ── State ──────────────────────────────────────────────────
  const API_URL = '/api/tasks';
  let tasks = [];
  let currentFilter = 'all';
  let searchQuery = '';

  const apiRequest = async (path, options = {}) => {
    const res = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...options,
    });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(body || 'API request failed');
    }
    if (res.status === 204) return null;
    return res.json();
  };

  const loadTasks = async () => {
    try {
      tasks = await apiRequest(API_URL);
    } catch (error) {
      console.error('Failed to load tasks:', error);
      tasks = [];
    }
    render();
  };

  const formatDate = (iso) => {
    const d = new Date(iso);
    const date = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return `${date} · ${time}`;
  };

  const render = () => {
    const q = searchQuery.toLowerCase();
    const filtered = tasks.filter(t => {
      const matchSearch = t.text.toLowerCase().includes(q);
      if (currentFilter === 'pending') return !t.done && matchSearch;
      if (currentFilter === 'done')    return  t.done && matchSearch;
      return matchSearch;
    });

    const pending = filtered.filter(t => !t.done);
    const done    = filtered.filter(t =>  t.done);

    renderList('pending-list', 'empty-pending', pending);
    renderList('done-list',    'empty-done',    done);

    const totalPending = tasks.filter(t => !t.done).length;
    const totalDone    = tasks.filter(t =>  t.done).length;

    document.getElementById('pending-badge').textContent = totalPending;
    document.getElementById('done-badge').textContent    = totalDone;
    document.getElementById('stat-pending-count').textContent = totalPending;
    document.getElementById('stat-done-count').textContent    = totalDone;

    document.getElementById('section-pending').style.display =
      (currentFilter === 'done') ? 'none' : '';
    document.getElementById('section-done').style.display =
      (currentFilter === 'pending') ? 'none' : '';
  };

  const renderList = (listId, emptyId, items) => {
    const list  = document.getElementById(listId);
    const empty = document.getElementById(emptyId);
    list.innerHTML = '';

    if (items.length === 0) {
      empty.classList.add('visible');
      return;
    }
    empty.classList.remove('visible');

    items.forEach(task => list.appendChild(buildCard(task)));
  };

  const buildCard = (task) => {
    const card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' done' : '');
    card.dataset.id = task.id;

    card.innerHTML = `
      <button class="check-btn" title="${task.done ? 'Mark pending' : 'Mark complete'}">
        <i class="fa-solid fa-check"></i>
      </button>
      <div class="task-body">
        <div class="task-text">${escHtml(task.text)}</div>
        <div class="task-meta">
          <span class="task-time"><i class="fa-regular fa-clock"></i>${formatDate(task.createdAt)}</span>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn edit-btn" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
        <button class="icon-btn delete-btn" title="Delete"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;

    card.querySelector('.check-btn').addEventListener('click', () => toggleDone(task.id, card));
    card.querySelector('.edit-btn').addEventListener('click', () => startEdit(task.id, card));
    card.querySelector('.delete-btn').addEventListener('click', () => deleteTask(task.id, card));

    return card;
  };

  const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const addTask = async () => {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) {
      input.focus();
      shakePulse(input);
      return;
    }

    try {
      const newTask = await apiRequest(API_URL, {
        method: 'POST',
        body: JSON.stringify({ text }),
      });
      tasks.unshift(newTask);
      render();
      input.value = '';
    } catch (error) {
      console.error('Unable to add task:', error);
    }
  };

  const toggleDone = (id, card) => {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    card.classList.add('completing');
    setTimeout(async () => {
      try {
        task.done = !task.done;
        await apiRequest(`${API_URL}/${encodeURIComponent(id)}`, {
          method: 'PUT',
          body: JSON.stringify({ done: task.done }),
        });
      } catch (error) {
        task.done = !task.done;
        console.error('Unable to toggle task:', error);
      }
      render();
    }, 400);
  };

  const deleteTask = (id, card) => {
    card.classList.add('deleting');
    setTimeout(async () => {
      try {
        await apiRequest(`${API_URL}/${encodeURIComponent(id)}`, { method: 'DELETE' });
        tasks = tasks.filter(t => t.id !== id);
        render();
      } catch (error) {
        console.error('Unable to delete task:', error);
      }
    }, 350);
  };

  const startEdit = (id, card) => {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    const bodyEl = card.querySelector('.task-body');
    const textEl = card.querySelector('.task-text');
    const actionsEl = card.querySelector('.task-actions');

    textEl.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'task-edit-input';
    input.value = task.text;
    input.maxLength = 200;
    bodyEl.insertBefore(input, bodyEl.querySelector('.task-meta'));
    input.focus();

    actionsEl.querySelector('.edit-btn').style.display = 'none';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'icon-btn save-btn';
    saveBtn.title = 'Save';
    saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i>';
    actionsEl.insertBefore(saveBtn, actionsEl.querySelector('.delete-btn'));

    const commit = async () => {
      const newText = input.value.trim();
      if (!newText) {
        shakePulse(input);
        input.focus();
        return;
      }
      try {
        await apiRequest(`${API_URL}/${encodeURIComponent(id)}`, {
          method: 'PUT',
          body: JSON.stringify({ text: newText }),
        });
        task.text = newText;
      } catch (error) {
        console.error('Unable to save task:', error);
      }
      render();
    };

    saveBtn.addEventListener('click', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape') render();
    });
  };

  const clearDone = () => {
    const doneTasks = tasks.filter(t => t.done);
    if (!doneTasks.length) return;
    const cards = document.querySelectorAll('#done-list .task-card');
    cards.forEach((c, i) => {
      setTimeout(() => c.classList.add('deleting'), i * 60);
    });
    setTimeout(async () => {
      try {
        await apiRequest(`${API_URL}?done=true`, { method: 'DELETE' });
        await loadTasks();
      } catch (error) {
        console.error('Unable to clear completed tasks:', error);
      }
    }, doneTasks.length * 60 + 380);
  };

  const shakePulse = (el) => {
    el.style.animation = 'none';
    el.style.borderColor = 'var(--accent2)';
    el.style.boxShadow = '0 0 0 3px rgba(255,107,107,0.18)';
    setTimeout(() => {
      el.style.borderColor = '';
      el.style.boxShadow = '';
    }, 700);
  };

  document.getElementById('add-btn').addEventListener('click', addTask);

  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value;
    render();
  });

  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('clear-done-btn').addEventListener('click', clearDone);

  loadTasks();
</script>
</body>
</html>
